[package]
name = "asterisco"
version = "1.0.0-rc.1"
description = "A native, local-first Markdown editor"
authors = ["Fabio Pastore"]
license = "MIT"
edition = "2021"
rust-version = "1.91"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name
# unique and avoid name collisions with the binary on Windows.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trash = "5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-window-state = "2.5.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-updater = "2.14.1"
ignore = "0.4.33"
tauri-plugin-log = "2.10.2"
tauri-plugin-opener = "2.7.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

# Smaller release binary (https://v2.tauri.app/concept/size/). Measured on Linux
# (2026-11-18): binary 31.97 MB -> 14.60 MB, .deb 11.91 MB -> 8.45 MB; each setting
# helped (without lto/codegen-units the binary was 20.18 MB). `panic = "abort"` is
# left out: a panic in one command would end the whole app instead of that call.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
