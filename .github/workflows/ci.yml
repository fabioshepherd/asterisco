name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes (one group per
# workflow and PR ref). Every other run (pushes to main, manual runs) gets a
# group of its own: a shared group would leave at most one run pending and
# cancel the one before it, and every commit that lands on main must be checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The GITHUB_TOKEN can only read the repository unless a job asks for more.
permissions:
  contents: read

jobs:
  frontend:
    needs: changes
    # Fail-safe: runs unless `changes` positively said "docs only". If `changes`
    # fails, its outputs are empty and this job still runs (a job skipped because
    # a needed job failed would otherwise report success).
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Decides which jobs run. A job skipped by `if:` reports success, so the
  # gated jobs stay usable as required checks (a workflow skipped by `paths:`
  # would leave them pending instead). On pushes to main and manual runs
  # everything runs. On a pull request:
  # - `rust` runs only when the pull request changes src-tauri/ or a workflow;
  # - `frontend`, `e2e` and `rust` are skipped when EVERY changed file is
  #   documentation, i.e. matches DOCS_ONLY: a Markdown file at the repository
  #   root, a Markdown file or image (svg, png, jpg, jpeg, gif, webp) under
  #   docs/, or the root THIRD-PARTY-NOTICES. Anything else (src/, src-tauri/,
  #   e2e/, public/, scripts/, .github/, config files, lockfiles, LICENSE, which
  #   the bundle packages) runs everything. `--no-renames` lists both sides of a
  #   rename, so moving code into docs/ is not docs-only; unusual paths come out
  #   quoted and never match. Keep DOCS_ONLY in sync with build-check.yml.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DOCS_ONLY: '^([^/]+\.md|docs/([^/]+/)*[^/]+\.(md|svg|png|jpe?g|gif|webp)|THIRD-PARTY-NOTICES)$'
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD")
          # Indented so a file name cannot be read as a workflow command (::...).
          echo "Changed files:"
          sed 's/^/  /' <<< "$files"
          if grep -qE '^(src-tauri/|\.github/workflows/)' <<< "$files"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$files" ] && ! grep -qvE "$DOCS_ONLY" <<< "$files"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    # Fail-safe like `frontend`: skipped only on an explicit "false".
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head on 2026-11-18)
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
