name: Manual suite

# Longer checks that run only by hand (Actions -> Manual suite -> Run workflow),
# e.g. before merging a large wave or tagging a release. Pick one area per run.
#
# Implemented areas:
# - e2e-ambiente: the e2e environment suite on Linux (e2e/environment): no
#   network, it/en UI, dark and light colour scheme, reduced motion.
#
# Bundle areas (bundle-windows, bundle-macos) and `tutto` are not offered:
# for 1.0, Windows and macOS are checked on the real draft release instead
# (owner decision, 2026-11-19; see docs/regia.md). Listing them would let a run
# report success for checks that never ran.

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to run
        required: true
        type: choice
        default: e2e-ambiente
        options:
          - e2e-ambiente

# The GITHUB_TOKEN can only read the repository unless a job asks for more.
permissions:
  contents: read

jobs:
  e2e-ambiente:
    if: inputs.area == 'e2e-ambiente'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          E2E_AREA: environment
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-environment
          path: playwright-report
          retention-days: 7
