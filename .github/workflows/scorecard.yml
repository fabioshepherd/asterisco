# Based on the official example of ossf/scorecard-action, as published with
# v2.6.0 (it still pins the action at v2.5.0):
# https://github.com/ossf/scorecard-action/blob/v2.6.0/examples/scorecard.yml
# Keep the shape close to it: with `publish_results: true` the Scorecard API
# verifies this workflow (no top-level env/defaults, no top-level write
# permissions, only the steps below).

name: Scorecard supply-chain security

on:
  # For the Branch-Protection check. Only the default branch is supported.
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # Keeps the Maintained check updated.
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
# Blocks all cache access (as in the official example).
cache-mode: none

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard only supports the default branch, and publishing results and
    # uploading them to code scanning need a public repository: the job is
    # skipped while the repository is private.
    if: github.event.repository.default_branch == github.ref_name && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the results published to api.scorecard.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
